server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: postiva-backend
  datasource:
    url: ${POSTIVA_DB_URL:jdbc:postgresql://localhost:5432/postiva}
    username: ${POSTIVA_DB_USERNAME:postgres}
    password: ${POSTIVA_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

postiva:
  frontend-origin: ${POSTIVA_FRONTEND_ORIGIN:http://localhost:5173}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  meta:
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    api-version: ${META_API_VERSION:v26.0}
    redirect-uri: ${META_REDIRECT_URI:http://localhost:8080/api/social/meta/callback}
  security:
    jwt-secret: ${POSTIVA_JWT_SECRET:change-this-development-jwt-secret-before-deploying}
    jwt-expiration-seconds: ${POSTIVA_JWT_EXPIRATION_SECONDS:604800}
    token-encryption-key: ${POSTIVA_TOKEN_ENCRYPTION_KEY:}
  storage:
    upload-dir: ${POSTIVA_UPLOAD_DIR:uploads/images}
  scheduler:
    publish-delay-ms: ${POSTIVA_PUBLISH_DELAY_MS:10000}
