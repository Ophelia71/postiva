# Run locally with --spring.profiles.active=dev; ignored .env can live in the project root or backend directory.
spring:
  datasource:
    url: ${POSTIVA_LOCAL_DB_URL:jdbc:postgresql://localhost:5432/postiva}

postiva:
  frontend-origin: http://localhost:5173
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
  storage:
    public-base-url: ${POSTIVA_LOCAL_PUBLIC_BASE_URL:${POSTIVA_PUBLIC_BASE_URL:http://localhost:8080}}
