services:

  postgres:
    image: postgres:16
    container_name: postiva-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTIVA_DB_USERNAME:?Set POSTIVA_DB_USERNAME}
      POSTGRES_PASSWORD: ${POSTIVA_DB_PASSWORD:?Set POSTIVA_DB_PASSWORD}
      POSTGRES_DB: ${POSTIVA_DB_NAME:-postiva}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - my_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  backend:
    image: devhoa/postiva-backend:${POSTIVA_IMAGE_TAG:?Set POSTIVA_IMAGE_TAG to an immutable release tag}
    container_name: postiva-backend
    restart: unless-stopped

    env_file:
      - ./.env

    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTIVA_TRUSTED_PROXY_ADDRESSES: ${POSTIVA_PROXY_IP}/32

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - postiva_uploads:/app/uploads

    networks:
      - my_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  frontend:
    image: devhoa/postiva-frontend:${POSTIVA_IMAGE_TAG:?Set POSTIVA_IMAGE_TAG to an immutable release tag}
    container_name: postiva-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

    depends_on:
      backend:
        condition: service_healthy

    networks:
      my_network:
        ipv4_address: ${POSTIVA_PROXY_IP:?Set POSTIVA_PROXY_IP}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


volumes:
  postgres_data:
  postiva_uploads:


networks:
  my_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${POSTIVA_DOCKER_SUBNET:?Set a private non-overlapping POSTIVA_DOCKER_SUBNET}
