server {
    listen 80;
    server_name postiva.store www.postiva.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://postiva.store$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name postiva.store www.postiva.store;

    ssl_certificate /etc/letsencrypt/live/postiva.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postiva.store/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;


    location /api/ {

        proxy_pass http://backend:8080/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;
    }


    location / {

        try_files $uri $uri/ /index.html;
    }


    location /.well-known/acme-challenge/ {

        root /var/www/certbot;
    }


    client_max_body_size 20M;
}