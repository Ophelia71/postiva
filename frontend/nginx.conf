server {
    listen 80;
    server_name postiva.store www.postiva.store;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://postiva.store$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name postiva.store www.postiva.store;

    ssl_certificate /etc/letsencrypt/live/postiva.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postiva.store/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Keep browser auth storage on one canonical origin.
    if ($host = www.postiva.store) {
        return 308 https://postiva.store$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;

        proxy_http_version 1.1;
        proxy_read_timeout 135s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace untrusted client-supplied chains at the public edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location = /_ops/ready {
        access_log off;
        proxy_pass http://backend:8080/actuator/health/readiness;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    client_max_body_size 12M;
}
