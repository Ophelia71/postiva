services:
  postgres:
    image: postgres:16
    container_name: postiva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTIVA_DB_NAME:-postiva}
      POSTGRES_USER: ${POSTIVA_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTIVA_DB_PASSWORD:-postiva_local_dev}
    ports:
      - "${POSTIVA_DB_PORT:-5432}:5432"
    volumes:
      - postiva_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postiva_postgres_data:
